name: CI

on:
  push:
    branches: [main, zion]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check backend tests
      - run: ruff format --check backend tests
      - run: pytest -q

  pipeline:
    name: Reproducible pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - run: smartcity ingest
      - run: smartcity train --no-figures
      - name: API smoke test
        run: |
          smartcity serve --port 5000 &
          for i in $(seq 1 20); do curl -sf localhost:5000/api/v1/health && break || sleep 1; done
          curl -sf localhost:5000/api/v1/overview > /dev/null
          curl -sf -X POST localhost:5000/api/v1/energy/forecast -H 'content-type: application/json' -d '{"zone":"Harbor"}' > /dev/null

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
